name: Feature request
description: Suggest something new for the Vita port, or a change to how it works.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How it could work, where in the game it matters, or another game or port that does it well.
    validations:
      required: false
