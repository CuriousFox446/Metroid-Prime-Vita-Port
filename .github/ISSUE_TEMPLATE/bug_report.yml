name: Bug report
description: A crash, a graphics or sound problem, broken controls, or anything else that doesn't work on the Vita.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The log file is the most useful thing you can attach: please don't skip it.

  - type: input
    id: build
    attributes:
      label: Build
      description: The VPK you installed (its release or file name), or the commit if you built it yourself.
      placeholder: "The latest release's metroid_prime_port.vpk"
    validations:
      required: true

  - type: input
    id: console
    attributes:
      label: Console
      description: The model (PCH-1000, PCH-2000 or PS TV), its firmware, and how it runs homebrew.
      placeholder: "PCH-2000, firmware 3.65, Ensō"
    validations:
      required: true

  - type: dropdown
    id: disc
    attributes:
      label: Metroid Prime disc
      options:
        - USA 1.00
        - USA 1.01
        - USA 1.02
        - PAL
        - I don't know
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. For graphics bugs a screenshot (PS + Start) or a photo helps a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where in the game (area and room), what you did, and whether it happens every time.
      placeholder: |
        1. Load the save at Chozo Ruins, Main Plaza
        2. Switch to the Wave Beam
        3. The game closes
    validations:
      required: false

  - type: dropdown
    id: when
    attributes:
      label: When does it happen?
      options:
        - It never starts (closes or shows nothing right away)
        - Before gameplay (logos, title, file select, intro)
        - During gameplay
        - Only with the Echoes suits, Dark Samus or the Federation Marine on
    validations:
      required: true

  - type: checkboxes
    id: setup
    attributes:
      label: Setup
      description: Tick everything that applies.
      options:
        - label: libshacccg.suprx is in ur0:data/
        - label: CapUnlocker is installed
        - label: The shader pack (precompiled.bin) is installed
        - label: The third-person camera is on
        - label: It worked in an earlier build

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag `ux0:data/MetroidPrime/metroid_prime_port.log` into this box (VitaShell's FTP or USB mode gets it off the
        memory card). If the game stopped before the log started, send `stdout.txt` and `stderr.txt` from the same folder.

        After a crash, also attach the newest `psp2core-*.psp2dmp` from `ux0:data/`. Zip it first: GitHub doesn't take
        `.psp2dmp` files as they are.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Settings you changed (frame rate cap, aspect ratio, controls...), mods you use, other things you tried.
    validations:
      required: false
